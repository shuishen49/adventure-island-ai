<svg viewBox="0 0 680 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>从 2KB NES 内存到 69 维观测向量的构建过程</title>
<desc>左侧为 NES 主内存 2KB，经过 ram_map 人工解码，输出右侧五组共 69 维特征，并与视觉分支拼接。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g class="node c-blue">
<rect x="40" y="140" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="125" y="160" text-anchor="middle" dominant-baseline="central">NES 主 RAM 2 KB</text>
<text class="ts" x="125" y="178" text-anchor="middle" dominant-baseline="central">2048 字节，不直接喂</text>
</g>
<g class="node c-blue">
<rect x="250" y="140" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="325" y="160" text-anchor="middle" dominant-baseline="central">ram_map 人工解码</text>
<text class="ts" x="325" y="178" text-anchor="middle" dominant-baseline="central">16 对象槽 stride 0x10</text>
</g>
<path class="arr" d="M210 168L250 168" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path class="arr" d="M400 168L418 168" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="420" y="40" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="55" text-anchor="middle" dominant-baseline="central">玩家 8 维</text>
<text class="ts" x="530" y="72" text-anchor="middle" dominant-baseline="central">x·y·速度·重力·体力·斧头·滑板</text>
</g>
<g class="node c-teal">
<rect x="420" y="94" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="109" text-anchor="middle" dominant-baseline="central">最近 4 个物体 16 维</text>
<text class="ts" x="530" y="126" text-anchor="middle" dominant-baseline="central">dx·dy·速度·类型（按距离排序）</text>
</g>
<g class="node c-teal">
<rect x="420" y="148" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="163" text-anchor="middle" dominant-baseline="central">全局 4 维</text>
<text class="ts" x="530" y="180" text-anchor="middle" dominant-baseline="central">命数·关卡·通关标志·世界进度</text>
</g>
<g class="node c-teal">
<rect x="420" y="202" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="217" text-anchor="middle" dominant-baseline="central">最近敌人·水果·道具 9 维</text>
<text class="ts" x="530" y="234" text-anchor="middle" dominant-baseline="central">dx·dy·有没有</text>
</g>
<g class="node c-teal">
<rect x="420" y="256" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="271" text-anchor="middle" dominant-baseline="central">关卡 one-hot 32 维</text>
<text class="ts" x="530" y="288" text-anchor="middle" dominant-baseline="central">当前在第几关</text>
</g>
<text class="t" x="640" y="318" text-anchor="end" dominant-baseline="central">合计 69 维</text>
<g class="node c-blue">
<rect x="420" y="336" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="351" text-anchor="middle" dominant-baseline="central">＋ 视觉分支 80×86×2</text>
<text class="ts" x="530" y="368" text-anchor="middle" dominant-baseline="central">灰度帧堆叠（CNN）</text>
</g>
</svg>
